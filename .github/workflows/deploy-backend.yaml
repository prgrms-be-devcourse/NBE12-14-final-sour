name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-backend.yaml"
      - "src/main/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "Dockerfile"
  # Actions 화면의 "Run workflow" 버튼
  # - image_tag를 비우면: 지금 main을 새로 태그·빌드·배포
  # - image_tag를 넣으면(예: v1.2.3): 빌드 없이 그 이미지로 다시 배포 (롤백, 실패한 배포 재시도)
  workflow_dispatch:
    inputs:
      image_tag:
        description: "다시 배포할 이미지 태그 (예: v1.2.3). 비우면 main을 새로 빌드"
        required: false
        default: ""

# 배포가 겹치지 않게 한 번에 하나만 돌린다
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: write   # 태그·릴리스 생성
  packages: write   # GHCR 푸시
  id-token: write   # AWS OIDC 로그인

env:
  AWS_REGION: ap-northeast-2
  IMAGE_NAME: sour-backend

jobs:
  makeTagAndRelease:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그 생성
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}

  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    needs: makeTagAndRelease
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # jar는 아키텍처와 상관없다. 러너에서 만들고 Docker는 복사만 한다 (QEMU로 Gradle을 돌리지 않음)
      - name: bootJar
        run: |
          ./gradlew bootJar --no-daemon
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar')" app.jar

      - name: 이미지 이름 (소문자)
        id: meta
        env:
          TAG: ${{ needs.makeTagAndRelease.outputs.tag_name }}
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WAS가 Graviton(t4g)이라 arm64만 만든다
      - name: 빌드 앤 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: WAS 배포
    needs: buildImageAndPush
    # 수동 재배포(image_tag 지정)는 빌드를 건너뛰므로 always()로 실행 여부를 직접 정한다
    if: >-
      always() && (
        needs.buildImageAndPush.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 배포할 이미지
        env:
          BUILT_IMAGE: ${{ needs.buildImageAndPush.outputs.image }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "태그 형식이 잘못됐다: $INPUT_TAG"; exit 1
            fi
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${INPUT_TAG}"
          else
            IMAGE="$BUILT_IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "배포할 이미지: $IMAGE"

      - name: AWS 로그인 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM 배포
        run: |
          aws ssm put-parameter --overwrite --name /sour/app/image --value "$IMAGE"

          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:Role,Values=was \
            --comment "deploy $IMAGE" \
            --parameters 'commands=["/opt/app/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          # 최대 5분 기다린다. 30초가 지나도 대상이 없으면 WAS가 꺼져 있거나 SSM 에이전트가 연결되지 않은 것이다
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            case "$STATUS" in
              Success)
                echo "배포 성공"; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
                exit 1 ;;
              None|"")
                if [ "$i" -ge 6 ]; then
                  echo "배포 대상 WAS가 없다 (꺼져 있거나 SSM 미연결). WAS 상태를 확인한 뒤 Run workflow로 image_tag를 넣어 다시 배포한다"
                  exit 1
                fi ;;
            esac
            sleep 5
          done
          echo "시간 초과"; exit 1