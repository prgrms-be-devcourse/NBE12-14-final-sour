name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yaml"
  # Actions 화면의 "Run workflow" 버튼
  # - release를 비우면: 지금 main을 새로 빌드·배포
  # - release를 넣으면(예: 커밋 SHA 앞 12자리): 빌드 없이 S3에 있는 그 버전으로 다시 배포 (롤백, 실패한 배포 재시도)
  workflow_dispatch:
    inputs:
      release:
        description: "다시 배포할 버전 (S3 releases/ 아래 이름). 비우면 main을 새로 빌드"
        required: false
        default: ""

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # AWS OIDC 로그인

env:
  AWS_REGION: ap-northeast-2
  KEEP_RELEASES: 20

jobs:
  build:
    name: 빌드
    if: github.event_name == 'push' || inputs.release == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: 타입 검사
        run: npm run lint
      - name: 테스트
        run: npm test

      - name: 빌드
        env:
          # 공개 값만 넣는다 (번들에 그대로 들어간다)
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          # API 절대 주소. 프론트 코드에서 쓰는 변수 이름에 맞춘다
          VITE_API_BASE_URL: https://api.devcproject.cloud
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: 배포
    needs: build
    # 수동 재배포(release 지정)는 빌드를 건너뛰므로 always()로 실행 여부를 직접 정한다
    if: >-
      always() && (
        needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.release != '')
      )
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
    steps:
      - name: 배포할 버전
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$INPUT_RELEASE" ]; then
            RELEASE="$INPUT_RELEASE"
          else
            RELEASE="${GITHUB_SHA::12}"
          fi
          if ! [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "버전 형식이 잘못됐다: $RELEASE"; exit 1
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "배포할 버전: $RELEASE"

      - name: AWS 로그인 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 빌드 결과 받기
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: S3에 올리기
        if: needs.build.result == 'success'
        run: aws s3 sync dist "s3://$BUCKET/releases/$RELEASE/" --delete --only-show-errors

      - name: 다시 배포할 버전이 S3에 있는지 확인
        if: needs.build.result != 'success'
        run: |
          if ! aws s3api head-object --bucket "$BUCKET" --key "releases/$RELEASE/index.html" >/dev/null 2>&1; then
            echo "s3://$BUCKET/releases/$RELEASE/ 가 없다. 최근 ${KEEP_RELEASES}개 버전만 남아 있다"; exit 1
          fi

      - name: WAS에 배포
        run: |
          aws ssm put-parameter --overwrite --name /sour/frontend/release --value "$RELEASE"

          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:Role,Values=was \
            --comment "frontend $RELEASE" \
            --parameters 'commands=["/opt/frontend/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          # 최대 3분 기다린다. 30초가 지나도 대상이 없으면 WAS가 꺼져 있거나 SSM 에이전트가 연결되지 않은 것이다
          for i in $(seq 1 36); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            case "$STATUS" in
              Success)
                echo "배포 성공"; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
                exit 1 ;;
              None|"")
                if [ "$i" -ge 6 ]; then
                  echo "배포 대상 WAS가 없다 (꺼져 있거나 SSM 미연결). WAS 상태를 확인한 뒤 Run workflow로 release=$RELEASE 를 넣어 다시 배포한다"
                  exit 1
                fi ;;
            esac
            sleep 5
          done
          echo "시간 초과"; exit 1

      # 배포가 성공한 뒤에만 정리한다. 최근 KEEP_RELEASES개와 지금 버전은 남긴다
      - name: 오래된 버전 정리
        run: |
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix releases/ \
            --query "Contents[?ends_with(Key, '/index.html')].[LastModified, Key]" --output text \
            | sort -r | tail -n +$((KEEP_RELEASES + 1)) | while read -r _ key; do
                v=$(basename "$(dirname "$key")")
                if [ "$v" != "$RELEASE" ]; then
                  echo "지움: $v"
                  aws s3 rm "s3://$BUCKET/releases/$v/" --recursive --only-show-errors
                fi
              done