name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]
  workflow_call:  # 나중에 CD 워크플로에서 호출하기 위한 자리

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 단위 테스트와 통합 테스트는 서로 의존하지 않아 다른 runner에서 동시에 돌린다
  unit-test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew test

      - name: 테스트 요약
        if: always()
        run: .github/scripts/test-summary.sh "단위" build/test-results/test

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/

  integration-test:
    name: 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 통합 테스트
        run: ./gradlew integrationTest

      - name: 테스트 요약
        if: always()
        run: .github/scripts/test-summary.sh "통합" build/test-results/integrationTest

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/

  # 브랜치 규칙(protect-main-dev)의 필수 체크 이름이 backend라서, 두 job의 결과를 모아 하나로 보고한다
  backend:
    runs-on: ubuntu-latest
    needs: [ unit-test, integration-test ]
    if: always()
    steps:
      - name: 테스트 결과 확인
        run: |
          echo "단위 테스트: ${{ needs.unit-test.result }}"
          echo "통합 테스트: ${{ needs.integration-test.result }}"
          if [ "${{ needs.unit-test.result }}" != "success" ] || [ "${{ needs.integration-test.result }}" != "success" ]; then
            exit 1
          fi