server:
  # 프록시(Nginx·ALB) 뒤에서 실제 사용자 IP를 request.getRemoteAddr()로 얻는다 (Tomcat RemoteIpValve, 인증 IP 한도의 기준).
  # 신뢰하는 프록시가 보낸 X-Forwarded-For만 반영하고, 그 밖의 곳에서 온 헤더는 무시한다.
  # 신뢰 대역은 server.tomcat.remoteip.internal-proxies (기본: 사설·루프백 대역, 환경 변수 SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES).
  # CloudFront 엣지는 공인 대역이라 신뢰되지 않는다. 운영 경로에 맞춘 설정은 GitHub Issue #66
  forward-headers-strategy: native

spring:
  application:
    name: NBE12-14-final-sour
  config:
    import: optional:file:.env[.properties]
  jackson:
    # API 명세서 §1: 시각은 KST 오프셋을 포함한 ISO-8601로 응답한다 (예: 2026-11-11T14:30:00+09:00)
    time-zone: Asia/Seoul
  # 학교 이메일 인증 메일. SPRING_MAIL_HOST·PORT·USERNAME·PASSWORD 환경 변수로 넣는다 (저장소에 커밋하지 않는다).
  # host가 없으면 prod가 아닌 프로필에서는 코드를 로그로 대신 남기고, prod에서는 앱이 시작하지 않는다 (VerificationMailConfig)
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # SMTP가 응답하지 않을 때 요청 스레드가 오래 묶이지 않도록 (밀리초)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  task:
    execution:
      # AsyncConfig가 문의 메일 전용 Executor 빈을 만들어도 기본 applicationTaskExecutor를 계속 만든다
      mode: force

  # S3 (로고 이미지 업로드). 리전은 앱이 뜰 때 반드시 필요하다.
  # 자격 증명은 실제로 S3를 호출할 때 찾는다 (운영 EC2는 IAM 역할, 로컬·테스트는 LocalStack)
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        # 로컬·테스트의 에뮬레이터(Floci)는 localhost 주소라서, 버킷 이름을 도메인이 아닌 경로에 넣는 방식을 쓴다.
        # 운영은 application-prod.yaml에서 false
        path-style-access-enabled: true
  servlet:
    multipart:
      # 로고 이미지 업로드 (로고 변경권 구매). 파일은 LogoImageValidator와 같은 5MB, 요청 전체는 multipart 부가 데이터 여유를 둠
      # 넘으면 GlobalExceptionHandler가 400 ITEM_LOGO_IMAGE_TOO_LARGE로 응답
      max-file-size: 5MB
      max-request-size: 6MB

# 인증 메일·문의 답변 메일 발신 주소 (VERIFICATION_MAIL_FROM). 없으면 spring.mail.username을 쓴다
verification-mail:
  from: ${VERIFICATION_MAIL_FROM:${spring.mail.username:}}

jwt:
  # HS256 서명 키, UTF-8로 32바이트 이상 (예: openssl rand -base64 48). 저장소에 커밋하지 않는다
  secret: ${JWT_SECRET}
  access-token-ttl: 60m
  refresh-token-ttl: 30d

auth:
  # 인증 API의 IP 기준 한도 (SCRUM-100). 학교 와이파이처럼 여러 학생이 한 IP를 쓰므로 넉넉히 잡는다.
  # 운영에서 바꾸려면 환경 변수 AUTH_IPLIMIT_LOGINMAXFAILURES 등을 쓴다 (AuthIpLimitProperties)
  ip-limit:
    # 로그인 실패만 센다 (비밀번호가 맞으면 빼 줌). 넘으면 첫 실패부터 10분이 끝날 때까지 그 IP의 로그인을 모두 거절
    login-max-failures: 30
    login-window: 10m
    # 학교 도메인이 맞는 인증 코드 요청을 모두 센다 (가입된 이메일 조회 포함)
    email-code-max-requests: 20
    email-code-window: 1h

support:
  # 문의 등록 한도 (SCRUM-110). 회원은 회원별, 비회원은 IP별로 센다. 첫 등록부터 window가 끝날 때까지 max-requests건.
  # 운영에서 바꾸려면 환경 변수 SUPPORT_RATELIMIT_MAXREQUESTS 등을 쓴다 (SupportRateLimitProperties)
  rate-limit:
    max-requests: 5
    window: 1h
  # 비회원 문의 봇 확인 (SCRUM-119). Turnstile이 켜져 있을 때 같은 IP의 창 안에서 verify-from번째 문의부터 토큰을 요구한다
  bot-check:
    verify-from: 3

turnstile:
  # 어뷰징 의심 시 Cloudflare Turnstile 봇 확인 (SCRUM-115). 꺼져 있으면 지금과 동작이 같다.
  # 켜려면 환경 변수 TURNSTILE_ENABLED=true, TURNSTILE_SECRET, TURNSTILE_HOSTNAMES(쉼표로 구분한 프론트 hostname)를 넣는다.
  # secret은 여기에 쓰지 않는다. prod의 TURNSTILE_HOSTNAMES에 localhost·127.0.0.1이 있으면 시작하지 않는다 (TurnstileConfig)
  enabled: false
  # siteverify 연결·응답 시간 초과. 넘으면 한 번 더 시도하고, 그래도 안 되면 통과시킨다 (fail-open)
  timeout: 3s

abuse:
  # 클릭 어뷰징 의심 표시와 봇 확인 (SCRUM-118). turnstile.enabled=false면 쓰지 않는다.
  # 운영에서 바꾸려면 환경 변수 ABUSE_VERIFICATION_FLAGTTL 등을 쓴다 (AbuseVerificationProperties)
  verification:
    # 클릭 한도를 넘은 회원의 "확인 필요" 표시 유지 시간. 확인을 통과하면 바로 지워진다
    flag-ttl: 24h
    # 회원당 확인 API 한도. 첫 시도부터 attempt-window 동안 max-attempts번
    max-attempts: 10
    attempt-window: 10m

email-crypto:
  # users.email AES-256-GCM 키. Base64로 인코딩한 32바이트 (예: openssl rand -base64 32). 저장소에 커밋하지 않는다
  encryption-key: ${EMAIL_ENCRYPTION_KEY}
  # users.email_hash HMAC-SHA256 키. Base64로 인코딩한 32바이트 이상. 바꾸면 기존 회원을 이메일로 찾을 수 없다
  hash-key: ${EMAIL_HASH_KEY}

file:
  # 업로드한 파일(S3)을 내려주는 공개 주소 (CloudFront). 프로필 이미지 URL 검사(ProfileImageUrlPolicy)에 쓴다.
  # 기본값은 추가 기능 API 명세서 예시의 주소다. 3번 업로드 모듈이 생기면 같은 값을 쓴다
  public-base-url: ${FILE_PUBLIC_BASE_URL:https://cdn.devcproject.cloud}
  # 로고 이미지를 올리는 버킷. 기본값은 로컬·테스트 에뮬레이터용 (운영은 FILE_LOGO_BUCKET 필수)
  logo-bucket: ${FILE_LOGO_BUCKET:local-logo-bucket}
  # 로고 이미지 주소의 앞부분. 기본값은 로컬 Floci 주소(compose의 4566 포트 + 경로 방식)라 로컬 브라우저에서 바로 열린다
  # 운영은 application-prod.yaml에서 CloudFront 주소(file.public-base-url)를 따른다
  logo-public-base-url: ${FILE_LOGO_PUBLIC_BASE_URL:http://localhost:4566/${file.logo-bucket}}
cors:
  # 쉼표로 구분한 origin 목록. 기본값은 로컬 프론트 개발 서버 (frontend/package.json의 vite --port=3000)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 점수 1분 배치 스케줄링
scheduling:
  enabled: true
  score-flush-delay: 60s

# 라이벌
rivals:
  groups:
    - [연세대학교, 고려대학교]
    - [KAIST, POSTECH]
    - [아주대학교, 인하대학교]
    - [서강대학교, 성균관대학교, 한양대학교]
    - [중앙대학교, 경희대학교]
#    - [한국외국어대학교, 서울시립대학교]
#    - [건국대학교, 동국대학교, 홍익대학교]
#    - [국민대학교, 숭실대학교]
#    - [세종대학교, 단국대학교]
#    - [광운대학교, 명지대학교]
#    - [이화여자대학교, 숙명여자대학교]
    - [가천대학교, 경기대학교]
    - [GIST, DGIST, UNIST]
    - [부산대학교, 경북대학교]
    - [전남대학교, 전북대학교]
    - [충남대학교, 충북대학교]
    - [강원대학교, 경상국립대학교]
#    - [서울교육대학교, 경인교육대학교]

chat:
  # 채팅 WebSocket 전송 한도 (SCRUM-128, ChatWebSocketProperties). 넘으면 그 연결을 끊는다.
  # 운영에서 바꾸려면 환경 변수 CHAT_WEBSOCKET_MESSAGESIZELIMIT 등을 쓴다
  websocket:
    # 클라이언트가 보내는 메시지 하나(바이트). 크게 키우면 Tomcat WebSocket 텍스트 버퍼(기본 8192)가 먼저 막을 수 있으니 함께 확인한다
    message-size-limit: 8KB
    # 연결 뒤 CONNECT를 기다리는 시간
    time-to-first-message: 10s
    # 아래 둘은 Spring 기본값. 느린 클라이언트에게 보내지 못하고 이만큼 밀리면 연결을 끊는다
    send-time-limit: 10s
    send-buffer-size-limit: 512KB

# 개발자 공용 계정 (SCRUM-237, GitHub #142, DevAccountProperties). 앱이 시작될 때 이 이메일의 계정이 없으면 만든다.
# 이미 있으면 아무것도 바꾸지 않는다. 이메일·비밀번호는 기본값이 없고, 하나라도 비어 있으면 만들지 않는다 (저장소·채팅에 올리지 않는다).
# 로컬 기본값은 켜짐·ADMIN, 운영은 application-prod.yaml에서 꺼짐·USER
dev-account:
  enabled: ${DEV_ACCOUNT_ENABLED:true}
  email: ${DEV_ACCOUNT_EMAIL:}
  password: ${DEV_ACCOUNT_PASSWORD:}
  nickname: ${DEV_ACCOUNT_NICKNAME:와플운영팀}
  # V14 마이그레이션의 숨김 학교와 학과
  university-name: 와플대학교
  department-name: 운영팀
  role: ${DEV_ACCOUNT_ROLE:ADMIN}

# API 문서 (OpenApiConfig). /api/** 만 싣고 actuator·/error는 뺀다. 운영은 application-prod.yaml에서 끈다
springdoc:
  paths-to-match: /api/**
  # 응답 타입을 */* 대신 application/json으로 표시한다
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha